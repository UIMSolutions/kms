# `npm start`: serves the app on http://localhost:8081 and proxies the API to the backend
specVersion: "4.0"
metadata:
  name: uim.myfiori.kms
type: application
resources:
  configuration:
    paths:
      webapp: .
framework:
  name: OpenUI5
  version: "1.136.10"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_fiori_3
server:
  settings:
    httpPort: 8081
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /api
      configuration:
        baseUri: "http://localhost:8080/api"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://localhost:8080/odata"
